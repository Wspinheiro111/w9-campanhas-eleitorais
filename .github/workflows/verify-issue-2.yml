name: verify-issue-2

on:
  push:
    branches:
      - fix/issue-2-totp-encryption-key

permissions:
  contents: read

concurrency:
  group: verify-issue-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/authSecurity.test.ts
