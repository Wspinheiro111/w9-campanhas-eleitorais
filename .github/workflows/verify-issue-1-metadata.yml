name: verify-issue-1-metadata

on:
  push:
    branches:
      - fix/issue-1-storage-proxy-authorization

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Storage metadata regression
        run: pnpm exec vitest run server/_core/storageProxy.test.ts
