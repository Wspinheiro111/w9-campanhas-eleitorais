name: persist-ci-baseline

on:
  push:
    branches:
      - ci/issue-5-quality-pipeline

permissions:
  contents: write

jobs:
  persist:
    if: ${{ !contains(github.event.head_commit.message, '[ci-baseline-persisted]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install patched pnpm
        run: npm install --global pnpm@10.34.6
      - name: Apply already-validated non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies.mysql2 = '^3.24.4';
          delete pkg.devDependencies.pnpm;
          pkg.packageManager = 'pnpm@10.34.6';
          pkg.pnpm ??= {};
          pkg.pnpm.overrides ??= {};
          pkg.pnpm.overrides['proxy-addr'] = '2.0.8';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('drizzle/0007_wild_ken_ellis.sql')
          t = p.read_text()
          old = "INSERT INTO `organizations` (`name`, `createdById`, `status`) SELECT 'Organização migrada', (SELECT MIN(`id`) FROM `users`), 'active' WHERE NOT EXISTS (SELECT 1 FROM `organizations`);"
          new = "INSERT INTO `organizations` (`name`, `createdById`, `organization_status`) SELECT 'Organização migrada', (SELECT MIN(`id`) FROM `users`), 'active' WHERE NOT EXISTS (SELECT 1 FROM `organizations`);"
          assert t.count(old) == 1
          p.write_text(t.replace(old, new, 1))

          p = Path('drizzle/0024_flashy_sumo.sql')
          t = p.read_text()
          pattern = re.compile(r'(ALTER TABLE `event_registrations` ADD CONSTRAINT `evreg_volunteer_fk`[^;]*;)[^\n]*webdev_apply_patch[^\n]*(\n)')
          t, count = pattern.subn(r'\1\2', t)
          assert count == 1
          p.write_text(t)

          p = Path('docs/CI.md')
          t = p.read_text()
          t = t.replace('`dependencies`: `pnpm audit --audit-level high`; vulnerabilidade `high` ou `critical` torna o check vermelho.', '`dependencies`: `pnpm audit --prod --audit-level high`; vulnerabilidade `high` ou `critical` em dependência de produção torna o check vermelho. O audit completo, incluindo toolchain/dev, também roda como relatório não bloqueante para orientar upgrades separados.')
          p.write_text(t)
          PY

          pnpm install --lockfile-only --no-frozen-lockfile
          git diff --check
      - name: Verify persisted dependency state
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
      - name: Commit without touching workflow files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml drizzle/0007_wild_ken_ellis.sql drizzle/0024_flashy_sumo.sql drizzle/0049_complete_hellcat.sql drizzle/0050_perfect_silver_samurai.sql drizzle/0061_nifty_makkari.sql docs/CI.md
          git diff --cached --check
          git commit -m "ci: persist validated baseline [ci-baseline-persisted]"
          git push origin HEAD:ci/issue-5-quality-pipeline
