name: verify-issue-1

on:
  push:
    branches:
      - fix/issue-1-storage-proxy-authorization

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_GA_MEASUREMENT_ID: G-ABCDEFGHIJ
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Python test dependency
        run: python -m pip install flask
      - name: Storage and tenant regression tests
        run: pnpm exec vitest run server/_core/storageProxy.test.ts server/tenantIsolation.test.ts server/campaignRoutes.test.ts server/campaignPolicy.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Deterministic test suite
        run: >-
          pnpm exec vitest run
          --exclude server/googleCredentials.test.ts
          --exclude server/openrouter.health.test.ts
          --exclude server/geminiApi.test.ts
          --exclude server/analytics.ga.test.ts
      - name: Build
        run: pnpm build
