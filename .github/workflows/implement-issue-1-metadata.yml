name: implement-issue-1-metadata

on:
  push:
    branches:
      - fix/issue-1-storage-proxy-authorization

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[metadata-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_GA_MEASUREMENT_ID: G-ABCDEFGHIJ
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply storage metadata schema and call-site patch
        run: |
          python - <<'PY'
          from pathlib import Path

          schema = Path('drizzle/schema.ts')
          text = schema.read_text()
          anchor = '''}, (table) => [index("campaign_owner_idx").on(table.ownerId), index("campaign_organization_idx").on(table.organizationId)]);\n\nexport const campaignMembers = mysqlTable("campaign_members", {'''
          insert = '''}, (table) => [index("campaign_owner_idx").on(table.ownerId), index("campaign_organization_idx").on(table.organizationId)]);\n\nexport const storageObjects = mysqlTable("storage_objects", {\n  id: int("id").autoincrement().primaryKey(),\n  storageKey: varchar("storageKey", { length: 1000 }).notNull(),\n  organizationId: int("organizationId").references(() => organizations.id),\n  campaignId: int("campaignId").references(() => campaigns.id),\n  visibility: mysqlEnum("visibility", ["private", "public"]).notNull().default("private"),\n  resourceType: varchar("resourceType", { length: 80 }).notNull(),\n  createdByUserId: int("createdByUserId").references(() => users.id),\n  createdAt: timestamp("createdAt").defaultNow().notNull(),\n  updatedAt: timestamp("updatedAt").defaultNow().onUpdateNow().notNull(),\n}, (table) => [\n  uniqueIndex("storage_object_key_unique_idx").on(table.storageKey),\n  index("storage_object_campaign_idx").on(table.campaignId),\n  index("storage_object_organization_idx").on(table.organizationId),\n  index("storage_object_visibility_idx").on(table.visibility),\n]);\n\nexport const campaignMembers = mysqlTable("campaign_members", {'''
          assert text.count(anchor) == 1, 'campaign schema anchor changed'
          schema.write_text(text.replace(anchor, insert, 1))

          ai = Path('server/routers/ai.ts')
          text = ai.read_text()
          text = text.replace('import { storagePut } from "../storage";', 'import { storageGetSignedUrl, storagePut } from "../storage";')
          old = '''    const savedFile = await storagePut(`campaigns/${input.campaignId}/audio-crm/${Date.now()}-${safeName}`, audioBuffer, input.mimeType);\n    const origin = `${ctx.req.protocol}://${ctx.req.get("host")}`;\n    const audioUrl = new URL(savedFile.url, origin).toString();\n    const transcription = await transcribeAudio({ audioUrl, language: "pt", prompt: "Transcreva fielmente este relato de campo em português brasileiro." });'''
          new = '''    const savedFile = await storagePut(`campaigns/${input.campaignId}/audio-crm/${Date.now()}-${safeName}`, audioBuffer, input.mimeType, { organizationId: access.campaign.organizationId, campaignId: input.campaignId, visibility: "private", resourceType: "audio_crm", createdByUserId: ctx.user.id });\n    const transcriptionUrl = await storageGetSignedUrl(savedFile.key);\n    const transcription = await transcribeAudio({ audioUrl: transcriptionUrl, language: "pt", prompt: "Transcreva fielmente este relato de campo em português brasileiro." });'''
          assert text.count(old) == 1, 'audio storage call anchor changed'
          ai.write_text(text.replace(old, new, 1))

          campaign = Path('server/routers/campaign.ts')
          text = campaign.read_text()
          replacements = [
            (
              'const stored = await storagePut(`campaigns/${content.campaignId}/materials/${content.id}/${safeName}`, bytes, input.mimeType);',
              'const stored = await storagePut(`campaigns/${content.campaignId}/materials/${content.id}/${safeName}`, bytes, input.mimeType, { organizationId: access.campaign.organizationId, campaignId: content.campaignId, visibility: "private", resourceType: "campaign_content_asset", createdByUserId: ctx.user.id });'
            ),
            (
              'const { url } = await storagePut(`campaign-certificates/${access.campaign.organizationId}/${input.campaignId}/${input.assetType}-${randomBytes(16).toString("hex")}.${asset.extension}`, asset.bytes, asset.mimeType);',
              'const { url } = await storagePut(`campaign-certificates/${access.campaign.organizationId}/${input.campaignId}/${input.assetType}-${randomBytes(16).toString("hex")}.${asset.extension}`, asset.bytes, asset.mimeType, { organizationId: access.campaign.organizationId, campaignId: input.campaignId, visibility: "public", resourceType: `certificate_${input.assetType}`, createdByUserId: ctx.user.id });'
            ),
            (
              'const stored = await storagePut(`campaigns/${document.campaignId}/legal/${document.id}/${Date.now()}-${safeName}`, bytes, "application/pdf");',
              'const stored = await storagePut(`campaigns/${document.campaignId}/legal/${document.id}/${Date.now()}-${safeName}`, bytes, "application/pdf", { organizationId: access.campaign.organizationId, campaignId: document.campaignId, visibility: "private", resourceType: "legal_document", createdByUserId: ctx.user.id });'
            ),
            (
              'const stored = await storagePut(`campaigns/${playbook.campaignId}/playbooks/${playbook.id}/materials/${Date.now()}-${randomBytes(8).toString("hex")}-${safeName}`, bytes, "application/pdf");',
              'const stored = await storagePut(`campaigns/${playbook.campaignId}/playbooks/${playbook.id}/materials/${Date.now()}-${randomBytes(8).toString("hex")}-${safeName}`, bytes, "application/pdf", { organizationId: access.campaign.organizationId, campaignId: playbook.campaignId, visibility: "private", resourceType: "playbook_material", createdByUserId: ctx.user.id });'
            ),
          ]
          for old, new in replacements:
            assert text.count(old) == 1, f'campaign storage call anchor changed: {old[:60]}'
            text = text.replace(old, new, 1)
          campaign.write_text(text)

          image = Path('server/_core/imageGeneration.ts')
          text = image.read_text()
          text = text.replace('import { storagePut } from "server/storage";', 'import { storagePut, type StorageObjectMetadataInput } from "server/storage";')
          marker = '''  /** Generation quality, e.g. "medium" | "high". Defaults to "medium" for GPT Image 2. */\n  quality?: string;\n};'''
          replacement = '''  /** Generation quality, e.g. "medium" | "high". Defaults to "medium" for GPT Image 2. */\n  quality?: string;\n  /** Explicit ownership/visibility metadata for the generated object. */\n  storageMetadata: StorageObjectMetadataInput;\n};'''
          assert text.count(marker) == 1, 'image options anchor changed'
          text = text.replace(marker, replacement, 1)
          old = '''    buffer,\n    result.image.mimeType\n  );'''
          new = '''    buffer,\n    result.image.mimeType,\n    options.storageMetadata\n  );'''
          assert text.count(old) == 1, 'image storage call anchor changed'
          image.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Generate migration and backfill legacy storage metadata
        env:
          DATABASE_URL: mysql://w9:w9@127.0.0.1:3306/w9
        run: |
          pnpm exec drizzle-kit generate --name storage_objects
          migration=$(ls drizzle/0062_*.sql)
          test -n "$migration"
          cat >> "$migration" <<'SQL'
          --> statement-breakpoint
          INSERT IGNORE INTO `storage_objects` (`storageKey`,`organizationId`,`campaignId`,`visibility`,`resourceType`,`createdByUserId`,`createdAt`,`updatedAt`)
          SELECT `assetKey`,`organizationId`,`campaignId`,'private','campaign_content_asset',NULL,`createdAt`,`updatedAt`
          FROM `campaign_contents`
          WHERE `assetKey` IS NOT NULL AND `assetKey` <> '';
          --> statement-breakpoint
          INSERT IGNORE INTO `storage_objects` (`storageKey`,`organizationId`,`campaignId`,`visibility`,`resourceType`,`createdByUserId`,`createdAt`,`updatedAt`)
          SELECT `storageKey`,`organizationId`,`campaignId`,'private','legal_document',`createdByUserId`,`createdAt`,`updatedAt`
          FROM `campaign_legal_documents`
          WHERE `storageKey` IS NOT NULL AND `storageKey` <> '';
          --> statement-breakpoint
          INSERT IGNORE INTO `storage_objects` (`storageKey`,`organizationId`,`campaignId`,`visibility`,`resourceType`,`createdByUserId`,`createdAt`,`updatedAt`)
          SELECT `storageKey`,`organizationId`,`campaignId`,'private','playbook_material',`createdByUserId`,`createdAt`,`createdAt`
          FROM `field_playbook_materials`
          WHERE `storageKey` IS NOT NULL AND `storageKey` <> '';
          --> statement-breakpoint
          INSERT IGNORE INTO `storage_objects` (`storageKey`,`organizationId`,`campaignId`,`visibility`,`resourceType`,`createdByUserId`,`createdAt`,`updatedAt`)
          SELECT SUBSTRING_INDEX(a.`audioUrl`, '/manus-storage/', -1),a.`organizationId`,a.`campaignId`,'private','audio_crm',m.`userId`,a.`createdAt`,a.`createdAt`
          FROM `audio_crm_logs` a
          LEFT JOIN `campaign_members` m ON m.`id` = a.`memberId` AND m.`campaignId` = a.`campaignId`
          WHERE LOCATE('/manus-storage/', a.`audioUrl`) > 0 AND SUBSTRING_INDEX(a.`audioUrl`, '/manus-storage/', -1) <> '';
          --> statement-breakpoint
          INSERT IGNORE INTO `storage_objects` (`storageKey`,`organizationId`,`campaignId`,`visibility`,`resourceType`,`createdByUserId`,`createdAt`,`updatedAt`)
          SELECT SUBSTRING_INDEX(`logoUrl`, '/manus-storage/', -1),`organizationId`,`campaignId`,'public','certificate_logo',`updatedByUserId`,`createdAt`,`updatedAt`
          FROM `campaign_certificate_settings`
          WHERE `logoUrl` IS NOT NULL AND LOCATE('/manus-storage/', `logoUrl`) > 0 AND SUBSTRING_INDEX(`logoUrl`, '/manus-storage/', -1) <> '';
          --> statement-breakpoint
          INSERT IGNORE INTO `storage_objects` (`storageKey`,`organizationId`,`campaignId`,`visibility`,`resourceType`,`createdByUserId`,`createdAt`,`updatedAt`)
          SELECT SUBSTRING_INDEX(`signatureImageUrl`, '/manus-storage/', -1),`organizationId`,`campaignId`,'public','certificate_signature',`updatedByUserId`,`createdAt`,`updatedAt`
          FROM `campaign_certificate_settings`
          WHERE `signatureImageUrl` IS NOT NULL AND LOCATE('/manus-storage/', `signatureImageUrl`) > 0 AND SUBSTRING_INDEX(`signatureImageUrl`, '/manus-storage/', -1) <> '';
          SQL
          grep -q 'CREATE TABLE `storage_objects`' "$migration"
          grep -q 'campaign_content_asset' "$migration"
          grep -q 'certificate_signature' "$migration"
      - name: Install deterministic Python test dependency
        run: python -m pip install flask
      - name: Storage authorization tests
        run: pnpm exec vitest run server/_core/storageProxy.test.ts server/tenantIsolation.test.ts server/campaignRoutes.test.ts server/campaignPolicy.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Deterministic suite
        run: >-
          pnpm exec vitest run
          --exclude server/googleCredentials.test.ts
          --exclude server/openrouter.health.test.ts
          --exclude server/geminiApi.test.ts
          --exclude server/analytics.ga.test.ts
      - name: Build
        run: pnpm build
      - name: Commit metadata implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle server/routers/ai.ts server/routers/campaign.ts server/_core/imageGeneration.ts
          git diff --cached --check
          git commit -m "fix: persist storage object ACL metadata [metadata-applied]"
          git push origin HEAD:fix/issue-1-storage-proxy-authorization
