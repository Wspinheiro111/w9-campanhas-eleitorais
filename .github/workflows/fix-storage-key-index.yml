name: fix-storage-key-index
on:
  push:
    branches: [fix/issue-1-storage-proxy-authorization]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[storage-key-index-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_GA_MEASUREMENT_ID: G-ABCDEFGHIJ
      DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/w9_ci
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: w9_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { run_install: false }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install flask
      - name: Patch indexable storage key limit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for file in ['drizzle/schema.ts','drizzle/0062_storage_objects.sql']:
              p=Path(file); t=p.read_text(); n=t.count('storageKey", { length: 1000') if file.endswith('.ts') else t.count('`storageKey` varchar(1000)')
              if n != 1: raise SystemExit(f'{file}: expected one 1000-length storageKey, got {n}')
              t=t.replace('storageKey", { length: 1000', 'storageKey", { length: 700') if file.endswith('.ts') else t.replace('`storageKey` varchar(1000)', '`storageKey` varchar(700)')
              p.write_text(t)
          p=Path('server/storage.ts'); t=p.read_text()
          old='''function normalizeKey(relKey: string): string {\n  return relKey.replace(/^\\/+/, "");\n}'''
          new='''export const MAX_STORAGE_KEY_LENGTH = 700;\n\nfunction normalizeKey(relKey: string): string {\n  const key = relKey.replace(/^\\/+/, "");\n  if (!key || key.length > MAX_STORAGE_KEY_LENGTH) throw new Error(`Storage key must contain between 1 and ${MAX_STORAGE_KEY_LENGTH} characters`);\n  return key;\n}'''
          if t.count(old)!=1: raise SystemExit('normalizeKey anchor mismatch')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Apply all migrations
        run: pnpm exec drizzle-kit migrate
      - name: Focused storage tests
        run: pnpm exec vitest run server/storage*.test.ts server/_core/storageProxy*.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Deterministic suite
        run: pnpm exec vitest run --exclude server/googleCredentials.test.ts --exclude server/openrouter.health.test.ts --exclude server/geminiApi.test.ts --exclude server/analytics.ga.test.ts
      - name: Build
        run: pnpm build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle server/storage.ts
          git diff --cached --check
          git commit -m "fix(storage): keep metadata key index within MySQL limit [storage-key-index-fixed]"
          git push
