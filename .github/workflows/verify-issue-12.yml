name: minimize-and-verify-issue-12

on:
  push:
    branches:
      - fix/issue-12-campaign-role-escalation

permissions:
  contents: write

concurrency:
  group: minimize-issue-12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimize:
    if: ${{ !contains(github.event.head_commit.message, '[minimalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_GA_MEASUREMENT_ID: G-ABCDEFGHIJ
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Restore original database module and apply minimal authorization patch
        run: |
          git fetch origin main
          git checkout origin/main -- server/campaignDb.ts
          rm -f server/campaignDbCore.ts server/campaignAccessFacade.test.ts
          python - <<'PY'
          from pathlib import Path

          path = Path('server/campaignDb.ts')
          text = path.read_text()

          import_anchor = 'import { and, desc, eq, gte, isNull, lt, lte, ne, or, sql } from "drizzle-orm";\n'
          assert text.count(import_anchor) == 1
          text = text.replace(import_anchor, import_anchor + 'import { resolveCampaignRole } from "./campaignPolicy";\n', 1)

          old = '''  return rows[0] ?? null;\n}\n\nexport async function createCampaignWithOwner'''
          new = '''  const access = rows[0] ?? null;\n  if (!access) return null;\n  return resolveCampaignRole({ memberRole: access.member?.role, campaignOwnerId: access.campaign.ownerId, userId }) ? access : null;\n}\n\nexport async function createCampaignWithOwner'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Python test dependency
        run: python -m pip install flask
      - name: Authorization regression tests
        run: pnpm exec vitest run server/campaignPolicy.test.ts server/campaignRoutes.test.ts server/tenantIsolation.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Deterministic test suite
        run: >-
          pnpm exec vitest run
          --exclude server/googleCredentials.test.ts
          --exclude server/openrouter.health.test.ts
          --exclude server/geminiApi.test.ts
          --exclude server/analytics.ga.test.ts
      - name: Build
        run: pnpm build
      - name: Commit minimalized hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/campaignDb.ts server/campaignPolicy.ts server/campaignPolicy.test.ts
          git add -A server/campaignDbCore.ts server/campaignAccessFacade.test.ts
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi
          git commit -m "fix: minimize campaign access hotfix [minimalized]"
          git push origin HEAD:fix/issue-12-campaign-role-escalation
