name: verify-issue-12

on:
  push:
    branches:
      - fix/issue-12-campaign-role-escalation

permissions:
  contents: read

concurrency:
  group: verify-issue-12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_GA_MEASUREMENT_ID: G-ABCDEFGHIJ
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic Python test dependency
        run: python -m pip install flask
      - name: Regression test - issue 12
        run: pnpm exec vitest run server/campaignPolicy.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Deterministic test suite
        run: >-
          pnpm exec vitest run
          --exclude server/googleCredentials.test.ts
          --exclude server/openrouter.health.test.ts
          --exclude server/geminiApi.test.ts
          --exclude server/analytics.ga.test.ts
      - name: Build
        run: pnpm build
