name: verify-issue-12

on:
  push:
    branches:
      - fix/issue-12-campaign-role-escalation

permissions:
  contents: read

concurrency:
  group: verify-issue-12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regression test - issue 12
        run: pnpm exec vitest run server/campaignPolicy.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Full test suite
        id: full_tests
        continue-on-error: true
        run: pnpm exec vitest run --reporter=json --outputFile=vitest-results.json
      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build
      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-12-vitest-report
          path: vitest-results.json
          if-no-files-found: warn
          retention-days: 1
      - name: Verification gate
        if: steps.full_tests.outcome != 'success' || steps.build.outcome != 'success'
        run: |
          echo "Full tests: ${{ steps.full_tests.outcome }}"
          echo "Build: ${{ steps.build.outcome }}"
          exit 1
