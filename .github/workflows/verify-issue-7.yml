name: verify-issue-7

on:
  push:
    branches:
      - fix/issue-7-synthetic-content-window

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/syntheticContentWindow.test.ts server/complianceEngine.test.ts server/syntheticContentRoutes.test.ts
