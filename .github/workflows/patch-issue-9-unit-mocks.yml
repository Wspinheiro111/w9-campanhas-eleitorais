name: patch-issue-9-unit-mocks
on:
  push:
    branches:
      - fix/issue-9-critical-write-transactions
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch unit mocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"missing expected block in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Finance routes now delegate persistence to the atomic command service.
          replace_once(
              'server/financeCycleStatus.test.ts',
              'vi.mock("./storage", () => ({ storagePut: vi.fn() }));\n\nimport * as db from "./campaignDb";',
              'vi.mock("./storage", () => ({ storagePut: vi.fn() }));\nvi.mock("./criticalWriteCommands", () => ({ createPublicIntakeAtomic: vi.fn(), createContentWithComplianceAtomic: vi.fn(), createFinancialWithComplianceAtomic: vi.fn(), commitVoterImportAtomic: vi.fn(), grantConsentAtomic: vi.fn(), revokeConsentAtomic: vi.fn() }));\n\nimport * as db from "./campaignDb";\nimport * as criticalWrites from "./criticalWriteCommands";'
          )
          replace_once(
              'server/financeCycleStatus.test.ts',
              '    vi.mocked(db.createFinancialEntry).mockResolvedValue(entryType === "income" ? 101 : 102);',
              '    vi.mocked(criticalWrites.createFinancialWithComplianceAtomic).mockResolvedValue({ id: entryType === "income" ? 101 : 102, decisionId: 501 } as never);'
          )
          replace_once(
              'server/financeCycleStatus.test.ts',
              '    expect(db.createFinancialEntry).toHaveBeenCalledWith(expect.objectContaining({ ...createPayload, entryType, createdByUserId: 99, paidAt: null }));',
              '    expect(criticalWrites.createFinancialWithComplianceAtomic).toHaveBeenCalledWith(expect.objectContaining({ campaignId: 1, entry: expect.objectContaining({ category: createPayload.category, counterpartyName: createPayload.counterpartyName, amountCents: createPayload.amountCents, entryType, createdByUserId: 99, paidAt: null }) }));'
          )
          replace_once(
              'server/financeCycleStatus.test.ts',
              '    vi.mocked(db.createFinancialEntry).mockResolvedValue(103);',
              '    vi.mocked(criticalWrites.createFinancialWithComplianceAtomic).mockResolvedValue({ id: 103, decisionId: 502 } as never);'
          )
          replace_once(
              'server/financeCycleStatus.test.ts',
              '    expect(db.createFinancialEntry).toHaveBeenCalledWith(expect.objectContaining({ eventId: 45, supplierName: "Gráfica da campanha", costCenter: "Mobilização" }));',
              '    expect(criticalWrites.createFinancialWithComplianceAtomic).toHaveBeenCalledWith(expect.objectContaining({ campaignId: 1, entry: expect.objectContaining({ eventId: 45, supplierName: "Gráfica da campanha", costCenter: "Mobilização" }) }));'
          )

          # Priority module consent routes use the same atomic service boundary.
          replace_once(
              'server/priorityModulesRoutes.test.ts',
              'vi.mock("./storage", () => ({ storagePut: vi.fn() }));\n\nimport * as db from "./campaignDb";',
              'vi.mock("./storage", () => ({ storagePut: vi.fn() }));\nvi.mock("./criticalWriteCommands", () => ({ createPublicIntakeAtomic: vi.fn(), createContentWithComplianceAtomic: vi.fn(), createFinancialWithComplianceAtomic: vi.fn(), commitVoterImportAtomic: vi.fn(), grantConsentAtomic: vi.fn(), revokeConsentAtomic: vi.fn() }));\n\nimport * as db from "./campaignDb";\nimport * as criticalWrites from "./criticalWriteCommands";'
          )
          replace_once(
              'server/priorityModulesRoutes.test.ts',
              '    vi.mocked(db.createConsentRecord).mockResolvedValue(33);',
              '    vi.mocked(criticalWrites.grantConsentAtomic).mockResolvedValue({ id: 33 } as never);'
          )
          replace_once(
              'server/priorityModulesRoutes.test.ts',
              '    expect(db.createConsentRecord).toHaveBeenCalledWith(expect.objectContaining({ voterId: 4, campaignId: 1, createdByUserId: 12, expiresAt }));',
              '    expect(criticalWrites.grantConsentAtomic).toHaveBeenCalledWith(expect.objectContaining({ voterId: 4, campaignId: 1, createdByUserId: 12, expiresAt }));'
          )
          replace_once(
              'server/priorityModulesRoutes.test.ts',
              '    vi.mocked(db.getConsentRecord).mockResolvedValue({ id: 33, voterId: 4 } as never); vi.mocked(db.getCampaignAccess).mockResolvedValue({ campaign, member: adminMember, organizationMember: { role: "admin" } } as never); vi.mocked(db.revokeConsentRecord).mockResolvedValue(undefined);',
              '    vi.mocked(db.getConsentRecord).mockResolvedValue({ id: 33, voterId: 4 } as never); vi.mocked(db.getCampaignAccess).mockResolvedValue({ campaign, member: adminMember, organizationMember: { role: "admin" } } as never); vi.mocked(criticalWrites.revokeConsentAtomic).mockResolvedValue({ success: true } as never);'
          )
          replace_once(
              'server/priorityModulesRoutes.test.ts',
              '    expect(db.revokeConsentRecord).toHaveBeenCalledWith(expect.objectContaining({ consentId: 33, revokedAt: expect.any(Date) }));',
              '    expect(criticalWrites.revokeConsentAtomic).toHaveBeenCalledWith(expect.objectContaining({ consentId: 33, campaignId: 1, actorUserId: 99, occurredAt: expect.any(Date) }));'
          )

          # CSV route unit tests mock the transaction command; transaction semantics have their own MySQL integration suite.
          replace_once(
              'server/dailyAndImportRoutes.test.ts',
              'import * as db from "./campaignDb";\nimport { appRouter } from "./routers";',
              'vi.mock("./criticalWriteCommands", () => ({ createPublicIntakeAtomic: vi.fn(), createContentWithComplianceAtomic: vi.fn(), createFinancialWithComplianceAtomic: vi.fn(), commitVoterImportAtomic: vi.fn(), grantConsentAtomic: vi.fn(), revokeConsentAtomic: vi.fn() }));\n\nimport * as db from "./campaignDb";\nimport * as criticalWrites from "./criticalWriteCommands";\nimport { appRouter } from "./routers";'
          )
          replace_once(
              'server/dailyAndImportRoutes.test.ts',
              '    vi.mocked(db.createVotersBatch).mockResolvedValue(0);\n    vi.mocked(db.updateVoterFromImport).mockResolvedValue(undefined);',
              '    vi.mocked(criticalWrites.commitVoterImportAtomic).mockResolvedValue({ imported: 0, updated: 1, createdIds: [], decisionId: 901 } as never);'
          )
          replace_once(
              'server/dailyAndImportRoutes.test.ts',
              '    expect(db.updateVoterFromImport).toHaveBeenCalledWith(8, expect.objectContaining({ name: "Ana Nova", email: "ana@example.com" }));',
              '    expect(criticalWrites.commitVoterImportAtomic).toHaveBeenCalledWith(expect.objectContaining({ campaignId: 1, updates: [expect.objectContaining({ voterId: 8, values: expect.objectContaining({ name: "Ana Nova", email: "ana@example.com" }) })] }));'
          )
          replace_once(
              'server/dailyAndImportRoutes.test.ts',
              '    vi.mocked(db.createVotersBatch).mockResolvedValue(0);',
              '    vi.mocked(criticalWrites.commitVoterImportAtomic).mockResolvedValue({ imported: 0, updated: 0, createdIds: [], decisionId: 902 } as never);'
          )
          replace_once(
              'server/dailyAndImportRoutes.test.ts',
              '    expect(db.createVotersBatch).toHaveBeenCalledWith([]);\n    vi.mocked(db.createVotersBatch).mockResolvedValue(1);',
              '    expect(criticalWrites.commitVoterImportAtomic).toHaveBeenCalledWith(expect.objectContaining({ newContacts: [] }));\n    vi.mocked(criticalWrites.commitVoterImportAtomic).mockResolvedValue({ imported: 1, updated: 0, createdIds: [321], decisionId: 903 } as never);'
          )
          replace_once(
              'server/dailyAndImportRoutes.test.ts',
              '    expect(db.createVotersBatch).toHaveBeenLastCalledWith([expect.objectContaining({ name: "Carla", campaignId: 1 })]);',
              '    expect(criticalWrites.commitVoterImportAtomic).toHaveBeenLastCalledWith(expect.objectContaining({ campaignId: 1, newContacts: [expect.objectContaining({ name: "Carla" })] }));'
          )
          PY
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/*.test.ts
          git commit -m "test(data): align route mocks with atomic write services"
          git push
