name: patch-issue5-long-fks

on:
  push:
    branches:
      - ci/issue-5-quality-pipeline

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[long-fks-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Shorten only MySQL-incompatible constraint identifiers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('drizzle/0061_nifty_makkari.sql')
          text = path.read_text()
          replacements = {
            'campaign_compliance_rule_sources_organizationId_organizations_id_fk': 'ccrs_org_fk',
            'campaign_data_subject_requests_organizationId_organizations_id_fk': 'cdsr_org_fk',
            'campaign_financial_entries_complianceReviewedByUserId_users_id_fk': 'cfe_review_user_fk',
          }
          for old, new in replacements.items():
            assert text.count(old) == 1, f'expected exactly one occurrence of {old}'
            text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
      - name: Commit migration identifier fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/0061_nifty_makkari.sql
          git commit -m "fix: shorten overlong migration foreign keys [long-fks-fixed]"
          git push origin HEAD:ci/issue-5-quality-pipeline
