name: patch-issue-1-test-contract

on:
  push:
    branches:
      - fix/issue-1-storage-proxy-authorization

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[storage-tests-updated]') && !contains(github.event.head_commit.message, '[metadata-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update expectations for required storage ACL metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/financeCycleStatus.test.ts')
          text = path.read_text()
          old = 'expect(storagePut).toHaveBeenCalledWith(expect.stringContaining("campaigns/1/legal/14/"), expect.any(Buffer), "application/pdf");'
          new = 'expect(storagePut).toHaveBeenCalledWith(expect.stringContaining("campaigns/1/legal/14/"), expect.any(Buffer), "application/pdf", expect.objectContaining({ organizationId: 3, campaignId: 1, visibility: "private", resourceType: "legal_document", createdByUserId: 99 }));'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))

          path = Path('server/priorityModulesRoutes.test.ts')
          text = path.read_text()
          old = 'expect(storagePut).toHaveBeenCalledWith(expect.stringMatching(/^campaign-certificates\\/1\\/1\\/logo-[a-f0-9]+\\.png$/), expect.any(Buffer), "image/png");'
          new = 'expect(storagePut).toHaveBeenCalledWith(expect.stringMatching(/^campaign-certificates\\/1\\/1\\/logo-[a-f0-9]+\\.png$/), expect.any(Buffer), "image/png", expect.objectContaining({ organizationId: 1, campaignId: 1, visibility: "public", resourceType: "certificate_logo", createdByUserId: 99 }));'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit updated test contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/financeCycleStatus.test.ts server/priorityModulesRoutes.test.ts
          git commit -m "test: require storage ACL metadata [storage-tests-updated]"
          git push origin HEAD:fix/issue-1-storage-proxy-authorization
