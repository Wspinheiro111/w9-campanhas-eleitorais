name: diagnose-ci-debt

on:
  push:
    branches:
      - ci/issue-5-quality-pipeline

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Locate broken organization migration order
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n -B 12 -A 18 "Organização migrada" drizzle || true
          echo '--- status column migrations ---'
          grep -R -n -B 5 -A 10 'organizations.*status\|status.*organizations' drizzle/*.sql || true
      - name: Runtime dependency audit details
        shell: bash
        run: |
          set +e
          pnpm audit --prod --audit-level high
          exit 0
