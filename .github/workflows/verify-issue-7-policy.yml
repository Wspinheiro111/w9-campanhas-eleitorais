name: verify-issue-7-policy

on:
  push:
    branches:
      - fix/issue-7-synthetic-content-compliance

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run server/syntheticContentPolicy.test.ts server/complianceEngine.test.ts
      - run: pnpm check
