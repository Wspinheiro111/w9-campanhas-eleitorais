            'commitCsv: protectedProcedure.input(campaignIdInput.extend({ csv: z.string().min(12).max(2_000_000), approvedUpdateRows: z.array(z.number().int().min(2)).max(1000), approvedCandidateRows: z.array(z.number().int().min(2)).max(1000), importPurpose: z.string().min(3).max(240).default("organização operacional de contatos"), importSource: z.string().min(2).max(120).default("importação CSV"), importEvidence: z.string().max(3000).optional(), commandKey: z.string().uuid().optional() })).mutation(async ({ ctx, input }) => {'
          )
          old = '''    const imported = await db.createVotersBatch(recordsToCreate);\n    const updates = review.updates.filter(item => input.approvedUpdateRows.includes(item.row) && item.existing).map(item => ({ item, row: sourceRows.get(item.row) })).filter((value): value is { item: typeof review.updates[number]; row: NonNullable<typeof value.row> } => Boolean(value.row));\n    await Promise.all(updates.map(({ item, row }) => db.updateVoterFromImport(item.existing!.id, { name: row.name, phone: row.phone, email: row.email, address: row.address, neighborhood: row.neighborhood, region: row.region, contactProfile: row.contactProfile, engagementLevel: row.engagementLevel, primaryDemand: row.primaryDemand, notes: row.notes, contactConsent: item.existing!.contactConsent, doNotContact: item.existing!.doNotContact })));\n    const importedRows = await db.listImportContacts(input.campaignId);\n    await Promise.all(importedRows.filter(contact => recordsToCreate.some(record => record.name === contact.name && record.phone === contact.phone && record.email === contact.email)).map(contact => db.appendCampaignConsentLedger({ campaignId: input.campaignId, voterId: contact.id, channel: "none", purpose: input.importPurpose, source: input.importSource, evidence: input.importEvidence ?? null, status: "imported_without_authorization", occurredAt: new Date(), recordedByUserId: ctx.user.id })));\n    const rules = await db.getCampaignComplianceRules(input.campaignId);\n    const decision = evaluateCompliance({ action: "contact.import", rules });\n    await db.recordCampaignComplianceDecision({ campaignId: input.campaignId, action: "contact.import", entityType: "voter_import", decision: decision.decision, reviewStatus: decision.reviewStatus, reasons: decision.reasons, ruleVersion: rules.ruleVersion, requestedByUserId: ctx.user.id });\n    return { imported, updated: updates.length, skippedCandidates: review.candidates.length - candidateRows.length, errors: [], importedContacts: recordsToCreate.map((contact, index) => ({ row: rowsToCreate[index].row, name: contact.name, email: contact.email, phone: contact.phone })), updatedContacts: updates.map(({ item, row }) => ({ row: row.row, name: row.name, existingId: item.existing!.id })) };'''
          new = '''    const updates = review.updates.filter(item => input.approvedUpdateRows.includes(item.row) && item.existing).map(item => ({ item, row: sourceRows.get(item.row) })).filter((value): value is { item: typeof review.updates[number]; row: NonNullable<typeof value.row> } => Boolean(value.row));\n    const rules = await db.getCampaignComplianceRules(input.campaignId);\n    const decision = evaluateCompliance({ action: "contact.import", rules });\n    const atomic = await commitVoterImportAtomic({ campaignId: input.campaignId, commandKey: input.commandKey ?? randomBytes(16).toString("hex"), newContacts: recordsToCreate.map(({ campaignId: _campaignId, ...contact }) => contact), updates: updates.map(({ item, row }) => ({ voterId: item.existing!.id, values: { name: row.name, phone: row.phone, email: row.email, address: row.address, neighborhood: row.neighborhood, region: row.region, contactProfile: row.contactProfile, engagementLevel: row.engagementLevel, primaryDemand: row.primaryDemand, notes: row.notes, contactConsent: item.existing!.contactConsent, doNotContact: item.existing!.doNotContact } })), purpose: input.importPurpose, source: input.importSource, evidence: input.importEvidence ?? null, actorUserId: ctx.user.id, decision: { decision: decision.decision, reviewStatus: decision.reviewStatus, reasons: decision.reasons, ruleVersion: rules.ruleVersion } });\n    return { imported: atomic.imported, updated: atomic.updated, skippedCandidates: review.candidates.length - candidateRows.length, errors: [], importedContacts: recordsToCreate.map((contact, index) => ({ row: rowsToCreate[index].row, name: contact.name, email: contact.email, phone: contact.phone })), updatedContacts: updates.map(({ item, row }) => ({ row: row.row, name: row.name, existingId: item.existing!.id })), decisionId: atomic.decisionId };'''
