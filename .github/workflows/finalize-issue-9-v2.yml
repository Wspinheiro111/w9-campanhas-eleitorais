            'server/routers/campaign.ts',
            'import { assertMandatoryComplianceSettings } from "../mandatoryComplianceBaseline";\n',
            'import { assertMandatoryComplianceSettings } from "../mandatoryComplianceBaseline";\nimport { commitVoterImportAtomic, createContentWithComplianceAtomic, createFinancialWithComplianceAtomic, createPublicIntakeAtomic, grantConsentAtomic, revokeConsentAtomic } from "../criticalWriteCommands";\n'
          )

