name: finalize-issue-9-v2
on:
  push:
    branches: [fix/issue-9-critical-write-transactions]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[issue-9-v2-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_GA_MEASUREMENT_ID: G-ABCDEFGHIJ
      DATABASE_URL: mysql://root:ci-root-password@127.0.0.1:3306/w9_ci
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: w9_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install flask
      - name: Add idempotency schema and wire atomic routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count}, got {actual}: {old[:140]!r}")
              p.write_text(text.replace(old, new, count))

          schema_anchor = '}, (table) => [index("campaign_owner_idx").on(table.ownerId), index("campaign_organization_idx").on(table.organizationId)]);\n'
          schema_add = schema_anchor + '''\n/** Resultado durável de comandos críticos para retries idempotentes. */\nexport const campaignCommandIdempotency = mysqlTable("campaign_command_idempotency", {\n  id: int("id").autoincrement().primaryKey(),\n  organizationId: int("organizationId").notNull().references(() => organizations.id),\n  campaignId: int("campaignId").notNull().references(() => campaigns.id),\n  operation: varchar("operation", { length: 80 }).notNull(),\n  commandKey: varchar("commandKey", { length: 128 }).notNull(),\n  result: json("result").$type<Record<string, unknown> | null>(),\n  createdAt: timestamp("createdAt").defaultNow().notNull(),\n  updatedAt: timestamp("updatedAt").defaultNow().onUpdateNow().notNull(),\n}, (table) => [\n  uniqueIndex("campaign_command_idempotency_unique").on(table.campaignId, table.operation, table.commandKey),\n  index("campaign_command_idempotency_org_idx").on(table.organizationId, table.createdAt),\n]);\n'''
