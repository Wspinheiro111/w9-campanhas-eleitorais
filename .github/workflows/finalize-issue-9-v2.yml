: input.supplierName ?? null, costCenter: input.costCenter ?? null, eventId: input.eventId ?? null, paymentMethod: input.paymentMethod ?? null, receiptNumber: input.receiptNumber ?? null, documentNumber: input.documentNumber ?? null, sourceType: input.sourceType ?? null, evidenceStatus: input.documentNumber || input.receiptNumber ? "attached" : "pending", complianceReviewStatus: decision.reviewStatus, complianceReviewNote: decision.reasons.join(" "), dueDate: input.dueDate ?? null, paidAt: input.paidAt ?? null, notes: input.notes ?? null }, decision: { decision: decision.decision, reviewStatus: decision.reviewStatus, reasons: decision.reasons, ruleVersion: rules.ruleVersion }, requestedByUserId: ctx.user.id }); return { id: atomic.id, compliance: decision, decisionId: atomic.decisionId }; }),'''
