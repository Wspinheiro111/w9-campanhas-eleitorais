t.sourceType ?? null, evidenceStatus: input.documentNumber || input.receiptNumber ? "attached" : "pending", complianceReviewStatus: decision.reviewStatus, complianceReviewNote: decision.reasons.join(" "), dueDate: input.dueDate ?? null, paidAt: input.paidAt ?? null, notes: input.notes ?? null }); await db.recordCampaignComplianceDecision({ campaignId: input.campaignId, action: "financial.register", entityType: "financial_entry", entityId: id, decision: decision.decision, reviewStatus: decision.reviewStatus, reasons: decision.reasons, ruleVersion: rules.ruleVersion, requestedByUserId: ctx.user.id }); return { id, compliance: decision }; }),'''
