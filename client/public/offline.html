<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#103527" />
    <title>W9 Campanhas — Sem conexão</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8f7f2;
        color: #173228;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 520px);
        padding: 40px;
        border: 1px solid #ded8cb;
        border-radius: 24px;
        background: #fffdf8;
        box-shadow: 0 18px 50px rgba(16, 53, 39, .12);
      }
      .mark {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        margin-bottom: 24px;
        border-radius: 18px;
        background: #103527;
        color: #f5d78b;
        font-size: 28px;
      }
      h1 { margin: 0 0 12px; font: 700 clamp(1.7rem, 5vw, 2.35rem)/1.1 Georgia, serif; }
      p { margin: 0; color: #59665f; font-size: 1rem; line-height: 1.6; }
      button {
        margin-top: 28px;
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        background: #103527;
        color: #fffdf8;
        font: 700 .95rem/1 Inter, ui-sans-serif, system-ui, sans-serif;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #c9a85b; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">⌁</div>
      <h1>Você está sem conexão</h1>
      <p>O W9 continuará disponível assim que a rede for restabelecida. Revise sua conexão e tente novamente.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
